<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu Catálogo - Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background-color: #b8f5d3;
            font-family: Georgia, "Times New Roman", serif;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 320px;
            padding: 0 20px 30px;
        }

        /* IMAGEM */
        .imagem-topo {
            width: 203px;
            height: 154px;
            object-fit: cover;
            display: block;
            margin: 0 auto 18px;
        }

        /* TÍTULO */
        h1 {
            margin: 0 0 10px;
            text-align: center;
            font-family: "Brush Script MT", "Segoe Script", cursive;
            font-size: 31px;
            font-weight: normal;
        }

        .subtitulo {
            margin: 0 0 60px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }

        /* CAMPOS */
        .campo {
            width: 100%;
            height: 45px;
            margin-bottom: 21px;
            padding: 0 7px;
            border: none;
            background-color: #f3b7ee;
            box-shadow: 0 3px 4px rgba(0, 0, 0, 0.28);
            font-family: Georgia, "Times New Roman", serif;
            font-size: 18px;
            font-weight: bold;
            outline: none;
        }

        .campo::placeholder {
            color: #000;
            opacity: 1;
        }

        .campo:focus {
            outline: 2px solid #c7199e;
        }

        /* BOTÕES */
        button {
            width: 100%;
            border: none;
            cursor: pointer;
            box-shadow: 0 3px 4px rgba(0, 0, 0, 0.28);
            font-family: Georgia, "Times New Roman", serif;
            font-weight: bold;
        }

        .btn-cadastro {
            height: 46px;
            margin-bottom: 20px;
            background-color: #c7199e;
            color: #000;
            text-align: left;
            padding-left: 7px;
            font-size: 18px;
        }

        .btn-entrar {
            height: 45px;
            background-color: #2942ed;
            color: #fff;
            font-size: 25px;
        }

        button:hover {
            filter: brightness(1.1);
        }

        button:active {
            transform: translateY(1px);
        }

        /* MENSAGEM */
        #mensagem {
            text-align: center;
            font-family: Arial, sans-serif;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .erro {
            color: #a00000;
        }

        .sucesso {
            color: #08733c;
        }
    </style>
</head>

<body>

    <main class="container">

        <!-- IMAGEM -->
        <img
            src="imagem-topo.png"
            alt="Meu Catálogo"
            class="imagem-topo"
        >

        <!-- TÍTULO -->
        <h1>Meu Catálogo</h1>

        <p class="subtitulo">
            Encontre o que você procura!
        </p>

        <!-- LOGIN -->
        <form id="loginForm">

            <input
                type="email"
                id="email"
                class="campo"
                placeholder="E-MAIL:"
                autocomplete="email"
                required
            >

            <input
                type="password"
                id="senha"
                class="campo"
                placeholder="SENHA:"
                autocomplete="current-password"
                required
            >

            <!-- IR PARA CADASTRO -->
            <button
                type="button"
                class="btn-cadastro"
                onclick="abrirCadastro()"
            >
                CRIAR CONTA
            </button>

            <div id="mensagem"></div>

            <!-- ENTRAR -->
            <button
                type="submit"
                class="btn-entrar"
            >
                ENTRAR
            </button>

        </form>

    </main>

    <script>

        /* =========================
           ABRIR TELA DE CADASTRO
        ========================= */

        function abrirCadastro() {
            window.location.href = "cadastro.html";
        }


        /* =========================
           LOGIN
        ========================= */

        document
            .getElementById("loginForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                const email = document
                    .getElementById("email")
                    .value
                    .trim()
                    .toLowerCase();

                const senha = document
                    .getElementById("senha")
                    .value;

                const mensagem =
                    document.getElementById("mensagem");


                /* Busca o usuário cadastrado */
                const usuario = JSON.parse(
                    localStorage.getItem("usuarioMeuCatalogo")
                );


                /* Verifica se existe cadastro */
                if (!usuario) {

                    mensagem.textContent =
                        "Nenhuma conta cadastrada.";

                    mensagem.className = "erro";

                    return;
                }


                /* Verifica o login */
                if (
                    email === usuario.email &&
                    senha === usuario.senha
                ) {

                    mensagem.textContent =
                        "Login realizado com sucesso!";

                    mensagem.className = "sucesso";

                    // Redireciona para o catálogo
                    // window.location.href = "catalogo.html";

                } else {

                    mensagem.textContent =
                        "E-mail ou senha incorreta.";

                    mensagem.className = "erro";

                }

            });

    </script>

</body>
</html>
